# STEP 3 — Training settings (read by: mlx_lm.lora -c lora_config.yaml)
# Every line here is a knob you will tune in real projects.

# The pretrained model we start from (downloaded from Hugging Face, ~1 GB).
model: "Qwen/Qwen2.5-0.5B-Instruct"

train: true
data: "data"                  # folder containing train/valid/test.jsonl
adapter_path: "adapters"      # where the small LoRA weights get saved

# LoRA = freeze the big model, train small "adapter" matrices next to it.
fine_tune_type: lora
num_layers: 16                # how many transformer layers get adapters (-1 = all 24)
lora_parameters:
  rank: 8                     # adapter size. Bigger = more capacity, more memory
  scale: 20.0                 # how strongly adapters affect the output
  dropout: 0.0

# Only learn from the assistant's answer, not from the prompt text.
mask_prompt: true

# Optimisation
iters: 400                    # training steps (400 x batch 4 = 1600 examples ~ 1.6 epochs)
batch_size: 4
learning_rate: 1e-4
max_seq_length: 512

# Monitoring
steps_per_report: 10          # print training loss every N steps
steps_per_eval: 50            # print validation loss every N steps
val_batches: 25
save_every: 100

seed: 0
